spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# In production, fail fast if schema mismatches instead of mutating unexpectedly.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

app.media.storage-provider=cloudinary
app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:/data/uploads/issues}
app.media.encryption-secret=${APP_MEDIA_ENCRYPTION_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.media.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.media.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.media.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.media.cloudinary.folder=${CLOUDINARY_FOLDER:citizensync/issues}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Many managed PostgreSQL providers require SSL.
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
